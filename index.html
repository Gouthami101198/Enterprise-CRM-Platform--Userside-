<!doctype html>
<html lang="en" class="dark" data-theme="sunset-copper">

<head>
  <script>
    try {
      const savedTheme = localStorage.getItem('vanguard_theme') || localStorage.getItem('zenithflow_theme') || localStorage.getItem('vedaflow_theme') || 'sunset-copper';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.documentElement.classList.add('dark');
    } catch (e) { }
  </script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanguard CRM Platform</title>
  <meta name="description"
    content="Vanguard CRM Platform User Panel for sales representatives, employees, and managers to manage leads, Kanban deals, customer profiles, tasks, and analytics." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>
