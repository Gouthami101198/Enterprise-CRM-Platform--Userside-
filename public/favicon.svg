<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="35%" stop-color="#d97706" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Subtle Internal Highlight Ring -->
  <rect x="9.5" y="9.5" width="109" height="109" rx="28.5" fill="none" stroke="#fde68a" stroke-width="2.5" stroke-opacity="0.45"/>
  
  <!-- Primary Sparkle Star (Center) -->
  <path d="M64 26 C64 45, 48 57, 28 64 C48 71, 64 83, 64 102 C64 83, 80 71, 100 64 C80 57, 64 45, 64 26 Z" fill="#ffffff"/>
  
  <!-- Secondary Accent Sparkle (Top-Right) -->
  <path d="M96 24 C96 32, 89 37, 80 40 C89 43, 96 48, 96 56 C96 48, 103 43, 112 40 C103 37, 96 32, 96 24 Z" fill="#fffbeb" opacity="0.95"/>
  
  <!-- Tertiary Micro Sparkle (Bottom-Left) -->
  <circle cx="36" cy="92" r="3.5" fill="#fffbeb" opacity="0.85"/>
</svg>
